# kst default configuration. Copy keys you want to change into config/local.yaml (git-ignored).
# Secrets NEVER go here — use .env (see .env.example). Full schema + comments: src/kst/config.py

app:
  mode: paper                 # paper | demo | live   (live also needs --i-understand-live-trading)
  data_dir: data
  trading_day_tz: America/New_York
  log_level: INFO

kalshi:
  env: prod                   # market-data environment (demo mode forces demo)
  read_tokens_per_s: 200      # Basic tier. `kst check` prints your real budgets.
  write_tokens_per_s: 100

universe:
  categories: []              # empty = all. e.g. [Crypto, "Climate and Weather", Economics]
  exclude_categories: [Mentions]
  include_series: []          # if non-empty, ONLY these series are scanned
  exclude_series: []
  min_volume_24h: 0
  max_hours_to_close: 336     # 14 days
  min_seconds_to_close: 60

marketdata:
  source: auto                # auto | ws | poll   (WS needs API keys)
  focus_size: 40              # markets with full-depth books
  poll_markets_interval_s: 20
  poll_books_interval_s: 3
  record: false               # record market data for replay/backtests

pricing:
  s_floor: 0.15               # min model uncertainty (logit). Higher = more conservative.
  s_p_base: 0.35              # market-price noise (logit). Lower = trust the market more = fewer trades.
  crypto:
    distribution: student_t
    nu: 5
    averaging_window_s: 60
  weather:
    bias_f: 0.5
    spread_inflation: 1.3

scanner:
  interval_s: 1.0
  top_n: 150
  min_edge_signal: 0.02

strategies:
  structural_arb:
    enabled: true
    margin: 0.005
    max_basket_usd: 50
  edge_taker:
    enabled: true
    min_edge: 0.02            # $/contract after fees
    z: 0.5
    kelly_fraction: 0.25
    entry_style: auto         # taker | maker | auto
  market_maker:
    enabled: false            # enable per series only after paper validation
    series: []

risk:
  limits:
    max_markets_per_day: 10   # "daily limit of markets"
    max_open_positions: 15
    max_order_contracts: 50
    max_order_usd: 50
    max_position_contracts: 100
    max_exposure_per_market_usd: 50
    max_exposure_per_event_usd: 100
    max_exposure_per_category_usd: 250
    max_total_exposure_usd: 500
    max_total_exposure_pct: 0.5
    min_entry_price: 0.03
    max_entry_price: 0.97
    max_price_deviation: 0.10
    min_seconds_to_close: 120
    daily_loss_limit_usd: 50  # → PAUSE
    max_drawdown_usd: 100     # → KILL
    max_consecutive_losses: 5 # → PAUSE
  order_ttl_s: 600
  ws_down_cancel_after_s: 15
  flatten_max_slippage: 0.05
  order_group:
    enabled: false
    contracts_limit: 500

engine:
  autotrade: false            # start with scanner + manual trading; enable after reviewing paper P&L
  tick_s: 0.25

llm:
  mode: gate                  # off | advisory | gate
  scope: unmodeled_only       # unmodeled_only | all
  provider:
    kind: openai_compatible   # Ollama / LM Studio / vLLM / llama.cpp / OpenAI
    base_url: http://localhost:11434/v1
    model: qwen3:14b
  batch_size: 15
  cache_ttl_s: 2700
  fallback: deny
  budget:
    max_calls_per_day: 40
    max_input_tokens_per_day: 60000
    max_output_tokens_per_day: 20000

discord:
  enabled: false              # set token/channel/allowed users in .env, then enable
  daily_report_time: "23:55"

web:
  enabled: true
  host: 127.0.0.1
  port: 8787

paper:
  starting_balance_usd: 1000

fees:
  taker_coef: 0.07
  maker_ratio: 0.25
