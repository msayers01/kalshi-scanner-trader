[project]
name = "kst"
version = "0.1.0"
description = "Kalshi scanner and quantitative auto-trader with risk engine, LLM entry gate, web UI and Discord control."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.28",
    "websockets>=15.0",
    "cryptography>=44.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.10",
    "structlog>=25.1",
    "orjson>=3.10",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "discord.py>=2.4",
    "tzdata>=2024.2",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[project.scripts]
kst = "kst.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kst"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF", "PT", "LOG"]
ignore = [
    "E501",    # formatter handles line length
    "RUF001",  # ambiguous unicode (we use math symbols in docstrings)
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends() in defaults
    "PT018",   # composite asserts are fine in tests
    "RUF009",  # NewType "calls" (Qty(0)) in dataclass defaults are plain ints
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["kst"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kst.discord_bot.*", "kst.api.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]
